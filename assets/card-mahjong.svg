<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 200" width="1300" height="200">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
      
      .title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #c9d1d9;
      }
      .tags {
        font-family: 'Fira Code', monospace, -apple-system, sans-serif;
        font-size: 14px;
        fill: #3fb950;
      }

      .glow {
        fill: #3fb950;
        filter: blur(40px);
        opacity: 0.1;
      }
    </style>
    <clipPath id="rectClip">
      <rect width="1300" height="200" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rectClip)">
    <rect width="1300" height="200" class="bg" rx="12"/>
    <circle cx="200" cy="100" r="100" class="glow" />
    
    <g transform="translate(60, 90)">
      <text x="0" y="0" class="title">Mahjong Score Mini App</text>
      <text x="0" y="40" class="tags">WeChat Mini Program · Cloud Functions · Cloud Database</text>
    </g>

    <g transform="translate(1150, 100)">
      <path fill="#3fb950" d="M0 -20 L20 0 L0 20 Z" />
    </g>
  </g>
</svg>
