<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 120" width="1300" height="120">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #8b949e;
        text-anchor: middle;
      }
      
      .subtext {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #484f58;
        text-anchor: middle;
      }

      .glow {
        fill: #58a6ff;
        filter: blur(20px);
        opacity: 0.1;
      }
    </style>
    <clipPath id="rectClip">
      <rect width="1300" height="120" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rectClip)">
    <rect width="1300" height="120" class="bg"/>
    <circle cx="650" cy="60" r="100" class="glow" />

    <text x="650" y="55" class="text">
      持续构建 · 持续交付 · 持续迭代
    </text>
    <text x="650" y="85" class="subtext">
      AI × Web × Products
    </text>
  </g>
</svg>
